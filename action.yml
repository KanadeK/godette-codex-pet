name: PetDiff CI
description: Compare two validated Codex v2 pet packages under an explicit visual budget.
author: KanadeK

branding:
  icon: eye
  color: green

inputs:
  baseline:
    description: Path to the known-good pet directory.
    required: true
  candidate:
    description: Path to the candidate pet directory.
    required: true
  output-dir:
    description: Directory for JSON, HTML, and PNG evidence.
    required: false
    default: petdiff-report
  channel-tolerance:
    description: Per-channel decoded difference ignored by the comparison.
    required: false
    default: "0"
  max-changed-cells:
    description: Maximum required v2 cells that may change.
    required: false
    default: "0"
  max-cell-change-ratio:
    description: Maximum changed-pixel ratio in any required cell.
    required: false
    default: "0"
  max-bbox-shift-px:
    description: Maximum visible bounds-center movement in pixels.
    required: false
    default: "0"

outputs:
  report-json:
    description: Path to the machine-readable report.
    value: ${{ steps.petdiff.outputs.report_json }}
  report-html:
    description: Path to the offline HTML report.
    value: ${{ steps.petdiff.outputs.report_html }}
  diff-sheet:
    description: Path to the highlighted PNG difference sheet.
    value: ${{ steps.petdiff.outputs.diff_sheet }}

runs:
  using: composite
  steps:
    - name: Install PetDiff CI
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$ACTION_PATH"

    - name: Compare Codex v2 pets
      id: petdiff
      shell: bash
      env:
        BASELINE: ${{ inputs.baseline }}
        CANDIDATE: ${{ inputs.candidate }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        CHANNEL_TOLERANCE: ${{ inputs.channel-tolerance }}
        MAX_CHANGED_CELLS: ${{ inputs.max-changed-cells }}
        MAX_CELL_CHANGE_RATIO: ${{ inputs.max-cell-change-ratio }}
        MAX_BBOX_SHIFT_PX: ${{ inputs.max-bbox-shift-px }}
      run: |
        set +e
        godette-pet diff "$BASELINE" "$CANDIDATE" \
          --output-dir "$OUTPUT_DIR" \
          --channel-tolerance "$CHANNEL_TOLERANCE" \
          --max-changed-cells "$MAX_CHANGED_CELLS" \
          --max-cell-change-ratio "$MAX_CELL_CHANGE_RATIO" \
          --max-bbox-shift-px "$MAX_BBOX_SHIFT_PX" \
          --json
        status=$?
        echo "report_json=$OUTPUT_DIR/report.json" >> "$GITHUB_OUTPUT"
        echo "report_html=$OUTPUT_DIR/report.html" >> "$GITHUB_OUTPUT"
        echo "diff_sheet=$OUTPUT_DIR/diff-sheet.png" >> "$GITHUB_OUTPUT"
        exit "$status"
