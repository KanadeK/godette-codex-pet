name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Format
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Python tests
        run: python -m pytest --cov=godette_pet --cov-report=term-missing

      - name: Browser-core tests
        run: node --test web/tests/*.test.mjs

      - name: Build Python distributions
        run: python -m build

      - name: Full artifact gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python scripts/release_check.py --json

      - name: Upload preflight evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight
          path: dist/preflight
          if-no-files-found: error

  action-smoke:
    name: Composite Action smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compare the release pet with itself
        uses: ./
        with:
          baseline: pet
          candidate: pet
          output-dir: petdiff-report

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: petdiff-self-check
          path: petdiff-report
          if-no-files-found: error
