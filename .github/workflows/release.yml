name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Verify source and artifacts
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m pytest --cov=godette_pet --cov-report=term-missing
          node --test web/tests/*.test.mjs
          python scripts/release_check.py --json

      - name: Build distributions and pet archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -m build
          godette-pet package \
            --repo-root . \
            --output "dist/godette-codex-pet-${TAG_NAME}.zip" \
            --version "${TAG_NAME#v}" \
            --json
          python scripts/make_checksums.py dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG_NAME"
          dist/*.whl
          dist/*.tar.gz
          dist/*.zip
          dist/SHA256SUMS.txt
          --verify-tag
          --generate-notes
          --title "Godette Codex Pet ${TAG_NAME}"
