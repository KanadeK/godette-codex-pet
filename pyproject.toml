[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "godette-codex-pet"
version = "0.1.0"
description = "Godette for Codex plus PetDiff CI, deterministic v2 pet visual regression."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "KanadeK", email = "121669563+KanadeK@users.noreply.github.com" },
]
keywords = [
  "codex",
  "codex-pet",
  "desktop-pet",
  "godette",
  "godot",
  "github-actions",
  "pixel-diff",
  "sprite",
  "visual-regression",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["Pillow>=10.4,<13"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "setuptools>=70,<84",
  "wheel>=0.45,<1",
]

[project.scripts]
godette-pet = "godette_pet.cli:main"
petdiff = "godette_pet.cli:main"

[project.urls]
Homepage = "https://kanadek.github.io/godette-codex-pet/"
Repository = "https://github.com/KanadeK/godette-codex-pet"
Issues = "https://github.com/KanadeK/godette-codex-pet/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["godette_pet"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
